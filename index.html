    let currentLang = 'ar';

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        updateUI();
    }

    function updateUI() {
        const d = menuData[currentLang];
        document.getElementById('txt-menu').innerText = d.menu;
        document.getElementById('txt-loc').innerText = d.loc;
        document.getElementById('txt-rate').innerText = d.rate;
        document.getElementById('txt-contact').innerText = d.contact;
        document.getElementById('txt-back-home').innerText = d.backHome;
        document.getElementById('txt-back-menu').innerText = d.backMenu;
        document.getElementById('txt-menu-title').innerText = d.menuTitle;
        document.getElementById('location-text').innerText = currentLang === 'ar' ? 'الزرقاء - ضاحية الأميرة سلمى' : 'Zarqa - Princess Salma Suburb';
    }

    function showHome() {
        document.getElementById('home-view').classList.remove('hidden');
        document.getElementById('categories-view').classList.add('hidden');
        document.getElementById('items-view').classList.add('hidden');
    }

    function showCategories() {
        document.getElementById('home-view').classList.add('hidden');
        document.getElementById('categories-view').classList.remove('hidden');
        document.getElementById('items-view').classList.add('hidden');

        const container = document.getElementById('cat-list-container');
        container.innerHTML = '';

        menuData[currentLang].categories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.onclick = () => showItems(cat.id);
            card.innerHTML = `
                <div class="category-info">
                    <i class="fa-solid ${cat.icon}"></i>
                    <div>
                        <h3>${cat.name}</h3>
                        <p>${cat.items.length} ${currentLang === 'ar' ? 'عناصر' : 'items'}</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-${currentLang === 'ar' ? 'left' : 'right'}"></i>
            `;
            container.appendChild(card);
        });
    }

    function showItems(catId) {
        document.getElementById('categories-view').classList.add('hidden');
        document.getElementById('items-view').classList.remove('hidden');

        const cat = menuData[currentLang].categories.find(c => c.id === catId);
        document.getElementById('category-title-header').innerText = cat.name;

        const container = document.getElementById('items-container');
        container.innerHTML = '';

        cat.items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <span class="item-name">${item.name}</span>
                <span class="item-price">${item.price}</span>
            `;
            container.appendChild(row);
        });
    }

    updateUI();
</script>
